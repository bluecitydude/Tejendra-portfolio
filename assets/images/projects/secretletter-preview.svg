<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  <rect x="40" y="40" width="720" height="400" rx="16" fill="#131d33" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>
  <!-- Window Controls -->
  <circle cx="70" cy="70" r="6" fill="#ef4444"/>
  <circle cx="90" cy="70" r="6" fill="#f59e0b"/>
  <circle cx="110" cy="70" r="6" fill="#10b981"/>
  <text x="140" y="75" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">secretletter.api/v1/encrypt</text>
  <line x1="40" y1="95" x2="760" y2="95" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- Content Preview -->
  <text x="70" y="145" fill="#38bdf8" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700">POST /api/cipher</text>
  <text x="70" y="180" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700">SecretLetter Encrypted Pipeline</text>
  <text x="70" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Multi-round OpenSSL cipher transformation • Zero persistence in DB/RAM</text>
  
  <!-- Diagram Mockup in SVG -->
  <g transform="translate(70, 240)">
    <rect x="0" y="0" width="180" height="85" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <text x="20" y="32" fill="#94a3b8" font-size="11" font-family="monospace">INPUT PAYLOAD</text>
    <text x="20" y="58" fill="#e2e8f0" font-size="14" font-weight="600">Plaintext Message</text>

    <!-- Arrow -->
    <path d="M 195 42 L 235 42 M 225 36 L 235 42 L 225 48" stroke="#38bdf8" stroke-width="2" fill="none"/>

    <rect x="250" y="0" width="200" height="85" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="270" y="32" fill="#38bdf8" font-size="11" font-family="monospace">PHP OPENSSL ENGINE</text>
    <text x="270" y="58" fill="#38bdf8" font-size="14" font-weight="600">AES-256-CBC + IV</text>

    <!-- Arrow -->
    <path d="M 465 42 L 505 42 M 495 36 L 505 42 L 495 48" stroke="#38bdf8" stroke-width="2" fill="none"/>

    <rect x="520" y="0" width="170" height="85" rx="8" fill="#1e293b" stroke="rgba(255,255,255,0.1)"/>
    <text x="540" y="32" fill="#10b981" font-size="11" font-family="monospace">CIPHERPAYLOAD</text>
    <text x="540" y="58" fill="#10b981" font-size="14" font-weight="600">Zero-Storage Delivery</text>
  </g>
  
  <!-- Badges -->
  <g transform="translate(70, 370)">
    <rect x="0" y="0" width="90" height="28" rx="6" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="45" y="18" fill="#38bdf8" font-size="12" font-family="monospace" text-anchor="middle" font-weight="600">PHP 8+</text>

    <rect x="102" y="0" width="115" height="28" rx="6" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="159" y="18" fill="#38bdf8" font-size="12" font-family="monospace" text-anchor="middle" font-weight="600">OpenSSL</text>

    <rect x="228" y="0" width="125" height="28" rx="6" fill="rgba(56, 189, 248, 0.15)"/>
    <text x="290" y="18" fill="#38bdf8" font-size="12" font-family="monospace" text-anchor="middle" font-weight="600">Headless API</text>

    <rect x="364" y="0" width="135" height="28" rx="6" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="431" y="18" fill="#10b981" font-size="12" font-family="monospace" text-anchor="middle" font-weight="600">Zero Storage</text>
